<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" width="720" height="730" role="img" aria-labelledby="at-title at-desc">
  <title id="at-title">What each of the four primary attributes buys</title>
  <desc id="at-desc">A map from the four primary attributes on the left to what each one buys on the right. Strength leads to maximum health and health regeneration. Agility leads to armour and attack speed. Intelligence leads to maximum mana, mana regeneration and magic resistance — not to spell damage. Universal leads to attack damage, from every point of any attribute. Strength, Agility and Intelligence each carry a dagger, marking the rule underneath: if it is your hero's primary attribute, each point of it also adds attack damage, which is why the same item is worth different amounts to two different heroes.</desc>
  <style>
    svg {
      color-scheme: light dark;
      color: var(--at-text, light-dark(oklch(from #b97d1c 20% .01 h), oklch(from #b97d1c 95% .005 h)));
      font-family: var(--at-font-body, ui-sans-serif, system-ui, sans-serif);
    }
    .pill { fill: var(--at-primary, #b97d1c); fill-opacity: .13; stroke: var(--at-primary, #b97d1c); stroke-width: 2.5; }
    .link { fill: none; stroke: currentColor; stroke-opacity: .42; stroke-width: 2.5; }
    text { fill: currentColor; }
    .ph { font-size: 26px; font-weight: 700; }
    .attr { font-size: 25px; font-weight: 700; }
    .stat { font-size: 24px; }
    .pay { font-size: 24px; font-weight: 700; }
    .qual { font-size: 19px; fill-opacity: .66; }
    .note { font-size: 20px; fill-opacity: .74; }
  </style>

  <text class="ph" x="44" y="46">What each attribute buys</text>

  <!-- Strength -->
  <line class="link" x1="250" y1="116" x2="416" y2="83"/>
  <line class="link" x1="250" y1="116" x2="416" y2="135"/>
  <rect class="pill" x="50" y="88" width="200" height="56" rx="28"/>
  <text class="attr" x="150" y="125" text-anchor="middle">Strength †</text>
  <text class="stat" x="430" y="90">Maximum health</text>
  <text class="stat" x="430" y="142">Health regeneration</text>

  <!-- Agility -->
  <line class="link" x1="250" y1="252" x2="416" y2="219"/>
  <line class="link" x1="250" y1="252" x2="416" y2="271"/>
  <rect class="pill" x="50" y="224" width="200" height="56" rx="28"/>
  <text class="attr" x="150" y="261" text-anchor="middle">Agility †</text>
  <text class="stat" x="430" y="226">Armour</text>
  <text class="stat" x="430" y="278">Attack speed</text>

  <!-- Intelligence -->
  <line class="link" x1="250" y1="400" x2="416" y2="341"/>
  <line class="link" x1="250" y1="400" x2="416" y2="393"/>
  <line class="link" x1="250" y1="400" x2="416" y2="445"/>
  <rect class="pill" x="50" y="372" width="200" height="56" rx="28"/>
  <text class="attr" x="150" y="409" text-anchor="middle">Intelligence †</text>
  <text class="stat" x="430" y="348">Maximum mana</text>
  <text class="stat" x="430" y="400">Mana regeneration</text>
  <text class="stat" x="430" y="452">Magic resistance</text>

  <!-- Universal -->
  <line class="link" x1="250" y1="540" x2="416" y2="533"/>
  <rect class="pill" x="50" y="512" width="200" height="56" rx="28"/>
  <text class="attr" x="150" y="549" text-anchor="middle">Universal</text>
  <text class="qual" x="52" y="592">every point of any attribute</text>
  <text class="pay" x="430" y="540">Attack damage</text>

  <text class="note" x="44" y="648">† If this is your hero's primary attribute, each point of it also</text>
  <text class="note" x="44" y="674">adds attack damage — which is why the same item is worth</text>
  <text class="note" x="44" y="700">different amounts to two different heroes.</text>
</svg>
